services:
  project-management:
    image: ${IMAGE_NAME:-ghcr.io/chunga00d1-code/project-management}:${IMAGE_TAG:-latest}
    container_name: ${CONTAINER_NAME:-project-management}
    restart: always
    env_file:
      - .env
    ports:
      - "127.0.0.1:${HOST_PORT:-2000}:2000"
    networks:
      - default_network
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  default_network:
    external: true
