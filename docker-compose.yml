services:
  github-pr-webhook:
    image: ${IMAGE_NAME:-ghcr.io/chung2310/github-pr-webhook}:${IMAGE_TAG:-latest}
    container_name: ${CONTAINER_NAME:-github-pr-webhook}
    restart: always
    env_file:
      - .env
    ports:
      - "127.0.0.1:${HOST_PORT:-2000}:2000"
    networks:
      - default_network
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  default_network:
    external: true
