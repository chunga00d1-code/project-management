name: CI/CD Pipeline

on:
  push:
    branches: [develop, production]
  pull_request:
    branches: [develop, production]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci-checks:
    name: Step 1 - Test webhook service
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Run unit tests
        run: npm test
      - name: Build application
        run: npm run build
      - name: Build Docker image (PR only)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false

  build-image:
    name: Step 2 - Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: ci-checks
    if: github.event_name == 'push'
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set lowercase image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max

  deploy:
    name: Step 3 - Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-image
    if: github.event_name == 'push'
    timeout-minutes: 15
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Copy compose file to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ github.ref_name == 'production' && secrets.SSH_HOST_PROD || secrets.SSH_HOST }}
          username: ${{ github.ref_name == 'production' && secrets.SSH_USER_PROD || secrets.SSH_USER }}
          key: ${{ github.ref_name == 'production' && secrets.SSH_KEY_PROD || secrets.SSH_KEY }}
          port: ${{ github.ref_name == 'production' && secrets.SSH_PORT_PROD || secrets.SSH_PORT || '22' }}
          source: docker-compose.yml
          target: /opt/github-pr-webhook/${{ github.ref_name }}
      - name: Deploy with Docker Compose
        uses: appleboy/ssh-action@v1.0.3
        env:
          ENV_FILE_CONTENT: ${{ github.ref_name == 'production' && secrets.ENV_FILE_PROD || secrets.ENV_FILE }}
          IMAGE_NAME: ghcr.io/${{ github.repository }}
          IMAGE_TAG: ${{ github.ref_name }}
          CONTAINER_NAME: github-pr-webhook-${{ github.ref_name }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        with:
          host: ${{ github.ref_name == 'production' && secrets.SSH_HOST_PROD || secrets.SSH_HOST }}
          username: ${{ github.ref_name == 'production' && secrets.SSH_USER_PROD || secrets.SSH_USER }}
          key: ${{ github.ref_name == 'production' && secrets.SSH_KEY_PROD || secrets.SSH_KEY }}
          port: ${{ github.ref_name == 'production' && secrets.SSH_PORT_PROD || secrets.SSH_PORT || '22' }}
          envs: ENV_FILE_CONTENT,IMAGE_NAME,IMAGE_TAG,CONTAINER_NAME,GHCR_TOKEN,GHCR_USER
          script: |
            set -eu
            TARGET_DIR="/opt/github-pr-webhook/${{ github.ref_name }}"
            mkdir -p "$TARGET_DIR"
            cd "$TARGET_DIR"
            printf '%s' "$ENV_FILE_CONTENT" > .env
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            export COMPOSE_PROJECT_NAME="$CONTAINER_NAME"
            export IMAGE_NAME IMAGE_TAG CONTAINER_NAME
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
            for i in $(seq 1 30); do
              if docker compose exec -T github-pr-webhook wget -qO- http://127.0.0.1:3000/health 2>/dev/null; then
                echo "Health check passed"
                exit 0
              fi
              echo "Waiting for service to be healthy ($i/30)..."
              sleep 2
            done
            echo "Health check failed after 60s, container logs:"
            docker compose logs --tail=100 github-pr-webhook
            exit 1
